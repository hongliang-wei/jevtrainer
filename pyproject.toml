[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevtrainer"
version = "0.1.0"
description = "Train Jev-like typed decision models (choice / score / noul) with one YAML file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.4",
  "torchvision",
  "transformers>=5.5",
  "peft>=0.18",
  "accelerate>=1.10",
  "datasets>=4.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6",
  "safetensors>=0.4",
  "pillow>=10",
  "numpy>=1.26",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
fast = ["flash-linear-attention"]
dev = ["pytest>=8"]

[project.scripts]
jt = "jevtrainer.cli:app"

[tool.setuptools.packages.find]
include = ["jevtrainer*"]

[tool.setuptools.package-data]
jevtrainer = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
