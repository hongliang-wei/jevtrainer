# First audio-visual Jev run: Qwen2.5-Omni-3B (thinker only), marker readout, LoRA.
# Video frames + the clip's own sound track are read together (use_audio_in_video, TMRoPE).
# Text rows are mixed in so the model keeps its plain-text decision behaviour.
model: Qwen/Qwen2.5-Omni-3B
readout: marker
readout_options:
  video_frames: 8
  frame_max_side: 448
  audio_max_s: 30
  use_audio_in_video: true
finetune: lora
output_dir: runs/av/omni3b_v0

dataset:
  - {name: avqa}
  - {name: music_avqa}
  - {name: boolq, max_samples: 1500}
  - {name: mnli, max_samples: 1500}
  - {name: agnews, max_samples: 1500}
  - {name: csqa, max_samples: 1500}

augment:
  p_none: 0.05
  p_pack: 0.0

epochs: 1
lr: 1.0e-4
weight_decay: 0.01
warmup_ratio: 0.03
batch_size: 2
grad_accum: 16
max_state_tokens: 4096
max_length: 6144
num_workers: 8
holdout: 0.02
save_steps: 200
report_to: none
resume: true
