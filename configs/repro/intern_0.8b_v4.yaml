# v4 = v3 + long-document decisions (data/converters/longdoc.py, longdoc2.py; train splits only).
# v1/v3 never trained on states over 1k tokens, and JevBench-Hard's long policy / multi-hop / numeric items
# got worse with training. The long-doc group adds ~110k records (~20% of records, a larger share of tokens):
# rule application (ShARC, LegalBench, CUAD, MAUD, ECtHR, LEDGAR), long reading and multi-hop (QuALITY,
# MuSiQue, HotpotQA, 2Wiki, WikiHop, TimeQA, QASPER, ReClor), numbers over reports and tables (TAT-QA, FinQA,
# DROP, TabFact), verification / faithfulness (DocNLI, WiCE, HaluEval), judging responses and agent outcomes
# (PPE-IFEval, RewardBench 1/2, MT-Bench human votes as soft targets, SWE-agent patches), and document triage
# (phishing, patents, hyperpartisan news). Most states are 1-3.5k tokens, so max_state_tokens is 4096.
# No standalone GUI datasets: GUI data comes only from OneJev, as in v3.
# Reproduce Intern-Decision-0.8B with open data: marker readout, full fine-tuning of Qwen3.5-0.8B,
# full-vocabulary cross-entropy at the placeholder positions (Intern's recipe), 1 epoch.
model: Qwen/Qwen3.5-0.8B
readout: marker
readout_options:
  full_vocab_loss: true
  image_pixel_budget: 2621440   # 2560 x 32 x 32: total pixels over a record's images
finetune: full
output_dir: runs/repro/intern_0.8b_v4

dataset:
  # same decision types as the test suites (different rows)
  - {name: typed_decisions, weight: 3}     # 1,200 states x 5 questions, teacher probabilities
  - {name: agnews, max_samples: 20000}
  - {name: toolace, max_samples: 10000}
  - {name: glaive_tools, max_samples: 8000}
  - {name: wildjailbreak, max_samples: 20000}   # gated; needs HF_TOKEN. Intern's test is the separate eval.tsv
  - {name: jailbreak_classification}
  - {name: toxic_chat}
  # breadth: intent, NLI, reading, knowledge, commonsense, sentiment, agents
  - {name: banking77}
  - {name: clinc150, max_samples: 8000}
  - {name: boolq}
  - {name: mnli, max_samples: 10000}
  - {name: anli, max_samples: 10000}
  - {name: arc}
  - {name: openbookqa}
  - {name: csqa}
  - {name: mmlu_aux, max_samples: 10000}
  - {name: hellaswag, max_samples: 8000}
  - {name: winogrande, max_samples: 8000}
  - {name: sst5}
  - {name: yelp, max_samples: 6000}
  - {name: gsm8k_mc}
  - {name: sms_spam}
  # Jev-format typed decisions (NanoJev partly Jev-distilled)
  - {name: kev_suites}
  - {name: jebadiah_synth}
  - {name: mojev_mix}
  - {name: nanojev}
  # multimodal: OneJev (images, screenshots, video frames; also text-only rows) + 10k image MCQ
  - {name: onejev}
  - {name: scienceqa_img, max_samples: 1562}
  - {name: cauldron_iconqa, max_samples: 4125}
  - {name: cauldron_aokvqa, max_samples: 2081}
  - {name: cauldron_scienceqa, max_samples: 1250}
  - {name: cauldron_ai2d, max_samples: 609}
  - {name: cauldron_tqa, max_samples: 373}
  # long-doc: rules, contracts, cases
  - {name: sharc, max_samples: 6000}
  - {name: legalbench_rules}
  - {name: legalbench_consumer_contracts}   # cc-by-nc
  - {name: legalbench_cuad, max_samples: 3000}
  - {name: maud, max_samples: 4000}
  - {name: ecthr}
  - {name: ledgar, max_samples: 3000}
  # long-doc: reading, multi-hop, time
  - {name: quality, weight: 2}               # 79 articles x <= 5 questions
  - {name: musique, max_samples: 10000}
  - {name: hotpotqa, max_samples: 6000}
  - {name: wiki2mh, max_samples: 4000}
  - {name: wikihop, max_samples: 5000}
  - {name: timeqa, max_samples: 6000}
  - {name: qasper, weight: 2}
  - {name: reclor}                           # research only
  # long-doc: numbers in reports and tables
  - {name: tatqa}
  - {name: finqa}
  - {name: drop, max_samples: 5000}
  - {name: tabfact, max_samples: 5000}
  # long-doc: verification and faithfulness
  - {name: docnli, max_samples: 6000}
  - {name: wice}
  - {name: halueval_summ, max_samples: 4000}
  # long-doc: judging responses and agent outcomes
  - {name: ppe_ifeval}
  - {name: reward_bench}
  - {name: reward_bench2}
  - {name: mt_bench_human}                   # soft targets from expert votes
  - {name: swe_agent, max_samples: 6000}    # balanced resolved / unresolved
  # long-doc: document triage
  - {name: phishing, max_samples: 4000}
  - {name: patents, max_samples: 3000}
  - {name: hyperpartisan}

augment:
  p_none: 0.05
  p_distract: 0.1
  p_pack: 0.15      # merge short single-question records into multi-question states
  pack_max: 4

epochs: 1
lr: 5.0e-6
weight_decay: 0.01
warmup_ratio: 0.03
batch_size: 16
grad_accum: 4
max_state_tokens: 4096
max_length: 6144
num_workers: 8    # image decoding + processor run in the loader (~0.1 s per OneJev record)
holdout: 0.02
eval_dataset: intern-accuracy-v1
save_steps: 1000
report_to: wandb
