# Qwen3.5-2B + LoRA, marker readout, on the agent mix.
# General sources are the v4 mix (configs/repro/qwen35_2b_lora_v4.yaml) without the five
# agent sets that are listed again below. Each cap is half the records that mix actually
# loaded; weights stay (typed_decisions 3, quality and qasper 2).
# GUI screenshots are 150,000 in total, split in proportion to each dataset's train cache.
# Tools, review, and the control-plane sets are taken in full.
# Same optimisation as the 2B v4 run: 1 epoch, batch 8 x accum 8, holdout 2%.
model: Qwen/Qwen3.5-2B
readout: marker
readout_options:
  full_vocab_loss: true
  image_pixel_budget: 2621440
finetune: lora
lora:
  r: 64
  alpha: 128
output_dir: runs/agent/agent_v1

dataset:
  # general, half of the v4 sample
  - {name: typed_decisions, weight: 3, max_samples: 600}
  - {name: agnews, max_samples: 10000}
  - {name: banking77, max_samples: 4996}
  - {name: clinc150, max_samples: 4000}
  - {name: boolq, max_samples: 4713}
  - {name: mnli, max_samples: 5000}
  - {name: anli, max_samples: 5000}
  - {name: arc, max_samples: 1685}
  - {name: openbookqa, max_samples: 2477}
  - {name: csqa, max_samples: 4809}
  - {name: mmlu_aux, max_samples: 5000}
  - {name: hellaswag, max_samples: 4000}
  - {name: winogrande, max_samples: 4000}
  - {name: sst5, max_samples: 4272}
  - {name: yelp, max_samples: 3000}
  - {name: gsm8k_mc, max_samples: 3736}
  - {name: sms_spam, max_samples: 2787}
  - {name: kev_suites, max_samples: 18644}
  - {name: jebadiah_synth, max_samples: 1626}
  - {name: mojev_mix, max_samples: 50000}
  - {name: nanojev, max_samples: 5449}
  - {name: onejev, max_samples: 47353}
  - {name: scienceqa_img, max_samples: 781}
  - {name: cauldron_iconqa, max_samples: 2062}
  - {name: cauldron_aokvqa, max_samples: 1040}
  - {name: cauldron_scienceqa, max_samples: 625}
  - {name: cauldron_ai2d, max_samples: 304}
