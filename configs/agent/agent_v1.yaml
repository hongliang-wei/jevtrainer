  - {name: legalbench_cuad, max_samples: 1500}
  - {name: maud, max_samples: 2000}
  - {name: ecthr, max_samples: 3520}
  - {name: ledgar, max_samples: 1500}
  - {name: quality, weight: 2, max_samples: 39}
  - {name: musique, max_samples: 5000}
  - {name: hotpotqa, max_samples: 3000}
  - {name: wiki2mh, max_samples: 2000}
