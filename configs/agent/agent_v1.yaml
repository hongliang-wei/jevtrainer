augment:
  p_none: 0.05
  p_distract: 0.1
  p_pack: 0.15
  pack_max: 4

epochs: 1
lr: 1.0e-4
weight_decay: 0.01
warmup_ratio: 0.03
batch_size: 8
grad_accum: 8
max_state_tokens: 4096
max_length: 6144
num_workers: 8
holdout: 0.02
eval_dataset: intern-accuracy-v1
save_steps: 1000
resume: true
report_to: wandb
